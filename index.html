<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TopClock</title>
</head>
<body>
    <div 
        id="app" 
        x-data="clockApp"
        @mousedown="handleMouseDown($event)"
        @mousemove="handleMouseMove($event)"
        @mouseup="handleMouseUp()"
        @contextmenu="handleContextMenu($event)"
        :class="{ 'ctrl-active': isCtrlHeld }"
    >
        <!-- The Clock itself (fades out when mouse approaches without Ctrl) -->
        <div 
            class="clock-container" x-ref="clockContainer"
            :class="{ 'faded': isNear && !isCtrlHeld }"
            @click="toggleFormat" 
            :title="t('app.moveHint', { modifier: settings?.shortcuts?.interaction_modifier || 'Ctrl' })"
        >
            <div class="addon-stack addon-stack-above" x-show="renderedAddons.some((item) => item.placement === 'above')" x-cloak>
                <template x-for="addon in renderedAddons.filter((item) => item.placement === 'above')" :key="addon.id">
                    <!-- addon-view:clock-row -->
                </template>
            </div>
            <div class="clock-digits" x-ref="clockDigits" :class="[`colon-${settings?.colon_animation || 'pulse'}`, `number-${settings?.number_animation || 'tick'}`]">
                <template x-for="(part, index) in parts" :key="index">
                    <span :class="{ 'clock-segment': ['h', 'm', 's'].includes(part.kind), 'clock-colon': part.kind === 'separator', 'clock-ampm': part.kind === 'ampm', 'number-changing': part.changing }" x-text="part.text"></span>
                </template>
            </div>
            <div class="addon-stack" x-show="renderedAddons.some((item) => item.placement === 'below')" x-cloak>
                <template x-for="addon in renderedAddons.filter((item) => item.placement === 'below')" :key="addon.id">
                    <!-- addon-view:clock-row -->
                </template>
            </div>
        </div>

    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
