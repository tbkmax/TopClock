<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TopClock</title>
</head>
<body>
    <div 
        id="app" 
        x-data="clockApp"
        @mousedown="handleMouseDown($event)"
        @mousemove="handleMouseMove($event)"
        @mouseup="handleMouseUp()"
        @contextmenu="handleContextMenu($event)"
        :class="{ 'ctrl-active': isCtrlHeld, 'menu-active': menuOpen }"
    >
        <!-- The Clock itself (fades out when mouse approaches without Ctrl) -->
        <div 
            class="clock-container" x-ref="clockContainer"
            :class="{ 'faded': isNear && !isCtrlHeld && !menuOpen }"
            @click="toggleFormat" 
            title="Hold Ctrl to Move or Right-Click"
        >
            <div class="addon-stack addon-stack-above" x-show="renderedAddons.some((item) => item.placement === 'above')" x-cloak>
                <template x-for="addon in renderedAddons.filter((item) => item.placement === 'above')" :key="addon.id">
                    <div class="addon-line" :class="{ 'addon-finished': addon.finished, 'addon-interactive': addon.kind === 'timer' }" :style="`font-size:${(settings?.font_size || 42) * addon.size_percent / 100}px`" @click.stop="addon.kind === 'timer' && timerClick()">
                        <span class="addon-label" x-show="addon.kind === 'region_clock' && addon.options.show_label !== false" x-text="addon.label"></span>
                        <span class="addon-text" x-show="!addon.parts" x-text="addon.text"></span>
                        <span class="addon-weekday" x-show="addon.weekday" x-text="addon.weekday"></span>
                        <span class="addon-time" x-show="addon.parts" :class="[`colon-${settings?.colon_animation || 'pulse'}`, `number-${settings?.number_animation || 'tick'}`]">
                            <template x-for="(part, index) in addon.parts || []" :key="index"><span :class="{ 'clock-segment': ['h', 'm', 's'].includes(part.kind), 'clock-colon': part.kind === 'separator', 'clock-ampm': part.kind === 'ampm', 'number-changing': part.changing }" x-text="part.text"></span></template>
                        </span>
                    </div>
                </template>
            </div>
            <div class="clock-digits" x-ref="clockDigits" :class="[`colon-${settings?.colon_animation || 'pulse'}`, `number-${settings?.number_animation || 'tick'}`]">
                <template x-for="(part, index) in parts" :key="index">
                    <span :class="{ 'clock-segment': ['h', 'm', 's'].includes(part.kind), 'clock-colon': part.kind === 'separator', 'clock-ampm': part.kind === 'ampm', 'number-changing': part.changing }" x-text="part.text"></span>
                </template>
            </div>
            <div class="addon-stack" x-show="renderedAddons.some((item) => item.placement === 'below')" x-cloak>
                <template x-for="addon in renderedAddons.filter((item) => item.placement === 'below')" :key="addon.id">
                    <div class="addon-line" :class="{ 'addon-finished': addon.finished, 'addon-interactive': addon.kind === 'timer' }" :style="`font-size:${(settings?.font_size || 42) * addon.size_percent / 100}px`" @click.stop="addon.kind === 'timer' && timerClick()">
                        <span class="addon-label" x-show="addon.kind === 'region_clock' && addon.options.show_label !== false" x-text="addon.label"></span>
                        <span class="addon-text" x-show="!addon.parts" x-text="addon.text"></span>
                        <span class="addon-weekday" x-show="addon.weekday" x-text="addon.weekday"></span>
                        <span class="addon-time" x-show="addon.parts" :class="[`colon-${settings?.colon_animation || 'pulse'}`, `number-${settings?.number_animation || 'tick'}`]">
                            <template x-for="(part, index) in addon.parts || []" :key="index"><span :class="{ 'clock-segment': ['h', 'm', 's'].includes(part.kind), 'clock-colon': part.kind === 'separator', 'clock-ampm': part.kind === 'ampm', 'number-changing': part.changing }" x-text="part.text"></span></template>
                        </span>
                    </div>
                </template>
            </div>
        </div>

        <!-- Dropdown Menu (Ctrl + Right-Click) -->
        <div 
            x-ref="dropdownMenu"
            x-show="menuOpen"
            @click.outside="closeMenu()"
            @keydown.escape.window="closeMenu()"
            x-transition:enter="menu-enter"
            x-transition:enter-start="menu-enter-start"
            x-transition:enter-end="menu-enter-end"
            x-transition:leave="menu-leave"
            x-transition:leave-start="menu-leave-start"
            x-transition:leave-end="menu-leave-end"
            class="dropdown-menu"
            :style="`left: ${menuX}px; top: ${menuY}px;`"
            x-cloak
        >
            <button class="menu-item" @click="openSettings()" title="Settings">
                <span class="menu-item-left">
                    <svg class="menu-icon settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                    <span>Settings</span>
                </span>
                <template x-if="settings?.shortcuts?.open_settings_enabled && settings?.shortcuts?.open_settings">
                    <span class="menu-shortcut" x-text="settings.shortcuts.open_settings"></span>
                </template>
            </button>
            <template x-if="timerEnabled"><button class="menu-item" @click="timerAction('reset')" title="Reset timer"><span class="menu-item-left"><span>Reset timer</span></span><template x-if="settings?.shortcuts?.timer_reset_enabled && settings?.shortcuts?.timer_reset"><span class="menu-shortcut" x-text="settings.shortcuts.timer_reset"></span></template></button></template>
            <div class="menu-divider"></div>
            <button class="menu-item" @click="quitApp" title="Quit Application">
                <span class="menu-item-left">
                    <svg class="menu-icon quit-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    <span>Quit</span>
                </span>
                <template x-if="settings?.shortcuts?.quit_enabled && settings?.shortcuts?.quit">
                    <span class="menu-shortcut" x-text="settings.shortcuts.quit"></span>
                </template>
            </button>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
