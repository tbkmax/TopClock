name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (leave blank to use version from tauri.conf.json, e.g. v0.1.0)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Windows .exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        run: npm ci

      - name: Determine version and release tag
        id: release_info
        shell: pwsh
        run: |
          $tauriConfig = Get-Content -Raw "src-tauri/tauri.conf.json" | ConvertFrom-Json
          $appVersion = $tauriConfig.version

          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.tag_name }}" -ne "") {
            $tag = "${{ inputs.tag_name }}"
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = "v$appVersion"
          }

          # Extract version from tag (e.g. v0.0.1 -> 0.0.1)
          if ($tag -match '^v?([0-9]+\.[0-9]+\.[0-9]+.*)$') {
            $appVersion = $Matches[1]
          }

          # Synchronize tauri.conf.json and Cargo.toml with the release version
          $tauriConfig.version = $appVersion
          $tauriConfig | ConvertTo-Json -Depth 10 | Set-Content "src-tauri/tauri.conf.json" -Encoding utf8

          $cargoContent = Get-Content -Raw "src-tauri/Cargo.toml"
          $cargoContent = $cargoContent -replace '(?m)^version\s*=\s*"[^"]+"', "version = `"$appVersion`""
          $cargoContent | Set-Content "src-tauri/Cargo.toml" -Encoding utf8

          Write-Host "Synchronized build version: $appVersion"
          Write-Host "Release Tag: $tag"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$appVersion"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag"

      - name: Build Tauri app and NSIS bundle
        run: npx tauri build

      - name: Prepare release assets
        shell: pwsh
        run: |
          $version = "${{ steps.release_info.outputs.version }}"
          $assetsDir = "release-assets"
          New-Item -ItemType Directory -Force -Path $assetsDir | Out-Null

          # 1. NSIS Installer
          $nsisPath = "src-tauri/target/release/bundle/nsis"
          $installers = Get-ChildItem -Path $nsisPath -Filter "*.exe" -File
          if ($installers.Count -eq 0) {
            Write-Error "No NSIS installer .exe found in $nsisPath"
            exit 1
          }
          foreach ($installer in $installers) {
            Write-Host "Found installer: $($installer.Name)"
            Copy-Item -Path $installer.FullName -Destination $assetsDir
          }

          # 2. Standalone Portable Executables
          $binary = "src-tauri/target/release/top_clock.exe"
          if (Test-Path $binary) {
            Copy-Item -Path $binary -Destination "$assetsDir/TopClock.exe"
            Copy-Item -Path $binary -Destination "$assetsDir/TopClock_${version}_portable.exe"
            Write-Host "Prepared standalone executables: TopClock.exe and TopClock_${version}_portable.exe"
          } else {
            Write-Error "Binary $binary not found"
            exit 1
          }

          # 3. Generate SHA-256 checksums
          Push-Location $assetsDir
          $checksums = Get-ChildItem -Filter "*.exe" | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.Name).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $checksums | Set-Content -Path "checksums-sha256.txt"
          Pop-Location

          Write-Host "Release assets prepared:"
          Get-ChildItem -Path $assetsDir | Format-Table Name, Length

      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "TopClock ${{ steps.release_info.outputs.tag }}"
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
