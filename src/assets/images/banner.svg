<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e12" />
      <stop offset="60%" stop-color="#08080a" />
      <stop offset="100%" stop-color="#040406" />
    </linearGradient>

    <!-- Electric Yellow Subtle Ambience -->
    <radialGradient id="electricGlow" cx="72%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#faff69" stop-opacity="0.10" />
      <stop offset="60%" stop-color="#faff69" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#faff69" stop-opacity="0" />
    </radialGradient>

    <!-- Yellow Glow Filter for Accents -->
    <filter id="yellowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Drop Shadow for the Mock Desktop Window -->
    <filter id="windowShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.85" />
    </filter>

    <!-- Outline filter for the real clock digits -->
    <filter id="clockShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Banner Background -->
  <rect width="1280" height="440" rx="20" fill="url(#bgCanvas)" />
  <rect width="1280" height="440" rx="20" fill="url(#electricGlow)" />
  <rect width="1280" height="440" rx="20" fill="none" stroke="#22222a" stroke-width="2" />

  <!-- Subtle Cyber Dots / Grid Pattern -->
  <g stroke="#1a1a24" stroke-width="1" opacity="0.35">
    <line x1="60" y1="0" x2="60" y2="440" />
    <line x1="200" y1="0" x2="200" y2="440" />
    <line x1="340" y1="0" x2="340" y2="440" />
    <line x1="480" y1="0" x2="480" y2="440" />
    <line x1="620" y1="0" x2="620" y2="440" />
    <line x1="760" y1="0" x2="760" y2="440" />
    <line x1="900" y1="0" x2="900" y2="440" />
    <line x1="1040" y1="0" x2="1040" y2="440" />
    <line x1="1180" y1="0" x2="1180" y2="440" />
    <line x1="0" y1="80" x2="1280" y2="80" />
    <line x1="0" y1="200" x2="1280" y2="200" />
    <line x1="0" y1="320" x2="1280" y2="320" />
  </g>

  <!-- LEFT COLUMN: Brand identity, Tagline, Feature Highlights -->
  <g transform="translate(76, 70)">
    <!-- Tech Tag Pill -->
    <rect x="0" y="0" width="224" height="28" rx="14" fill="#14141a" stroke="#2b2b36" stroke-width="1.2" />
    <circle cx="14" cy="14" r="3.5" fill="#faff69" filter="url(#yellowGlow)" />
    <text x="26" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="700" fill="#cfcfe0" letter-spacing="1.5">TAURI 2 · RUST · ALPINE</text>

    <!-- Main Title -->
    <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="52" font-weight="900" fill="#faff69" letter-spacing="-1.5">TOPCLOCK</text>
    
    <!-- Subheading -->
    <text x="0" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="21" font-weight="600" fill="#ffffff" letter-spacing="-0.3">Purely Transparent. Always On Top.</text>

    <!-- Description -->
    <text x="0" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14.5" font-weight="400" fill="#9ca3af">
      <tspan x="0" dy="0">No window borders, no backgrounds—only the clock itself.</tspan>
      <tspan x="0" dy="24">Clicks pass directly through to your apps and games below.</tspan>
    </text>

    <!-- Feature Pills Grid -->
    <g transform="translate(0, 224)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="138" height="32" rx="8" fill="#131318" stroke="#252530" stroke-width="1.2" />
      <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600" fill="#e2e2ec">👻 Ghost Click</text>

      <!-- Pill 2 -->
      <rect x="148" y="0" width="144" height="32" rx="8" fill="#131318" stroke="#252530" stroke-width="1.2" />
      <text x="162" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600" fill="#e2e2ec">💨 Proximity Fade</text>

      <!-- Pill 3 -->
      <rect x="302" y="0" width="124" height="32" rx="8" fill="#131318" stroke="#252530" stroke-width="1.2" />
      <text x="316" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600" fill="#e2e2ec">⌨️ Ctrl HUD</text>

      <!-- Pill 4 -->
      <rect x="436" y="0" width="130" height="32" rx="8" fill="#131318" stroke="#252530" stroke-width="1.2" />
      <text x="450" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600" fill="#e2e2ec">🔒 100% Offline</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: REALISTIC DESKTOP ENVIRONMENT WITH THE REAL TRANSPARENT CLOCK FLOATING ON TOP -->
  <g transform="translate(690, 52)" filter="url(#windowShadow)">
    
    <!-- MOCK APPLICATION / WINDOW UNDERNEATH (e.g., Code Editor / Browser Tab) -->
    <rect x="0" y="0" width="510" height="336" rx="12" fill="#18181f" stroke="#2a2a36" stroke-width="1.5" />
    
    <!-- Titlebar of the background application -->
    <path d="M 0 12 Q 0 0 12 0 L 498 0 Q 510 0 510 12 L 510 40 L 0 40 Z" fill="#121217" />
    <line x1="0" y1="40" x2="510" y2="40" stroke="#252530" stroke-width="1" />
    
    <!-- Windows Window Controls in background window (minimize, maximize, close) -->
    <g transform="translate(420, 14)">
      <!-- Minimize button -->
      <line x1="6" y1="8" x2="16" y2="8" stroke="#888898" stroke-width="1.4" />
      <!-- Maximize button -->
      <rect x="34" y="2" width="10" height="10" fill="none" stroke="#888898" stroke-width="1.4" />
      <!-- Close button -->
      <line x1="62" y1="2" x2="72" y2="12" stroke="#888898" stroke-width="1.4" />
      <line x1="72" y1="2" x2="62" y2="12" stroke="#888898" stroke-width="1.4" />
    </g>

    <!-- Tab / Document Title in background window -->
    <g transform="translate(20, 12)">
      <rect x="0" y="0" width="150" height="28" rx="6" fill="#1b1b24" stroke="#2e2e3c" stroke-width="1" />
      <circle cx="14" cy="14" r="3.5" fill="#3b82f6" />
      <text x="26" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="500" fill="#b0b0c2">main.rs - Project</text>
    </g>

    <!-- Mock IDE / Background Code Content (shows what sits behind the clock) -->
    <g transform="translate(24, 62)" font-family="'Consolas', 'Courier New', monospace" font-size="12.5" opacity="0.65">
      <text x="0" y="18" fill="#e5c07b"><tspan fill="#c678dd">fn </tspan><tspan fill="#61afef">main</tspan>() {</text>
      <text x="20" y="44" fill="#98c379"><tspan fill="#e06c75">tauri</tspan>::Builder::default()</text>
      <text x="40" y="70" fill="#abb2bf">.setup(|app| {</text>
      <text x="60" y="96" fill="#7f848e">// transparent window: clicks pass straight through</text>
      <text x="60" y="122" fill="#e5c07b">window.<tspan fill="#61afef">set_ignore_cursor_events</tspan>(<tspan fill="#d19a66">true</tspan>)?;</text>
      <text x="60" y="148" fill="#abb2bf">window.<tspan fill="#61afef">set_always_on_top</tspan>(<tspan fill="#d19a66">true</tspan>)?;</text>
      <text x="40" y="174" fill="#abb2bf">})</text>
      <text x="20" y="200" fill="#abb2bf">.run(context)?;</text>
      <text x="0" y="226" fill="#abb2bf">}</text>
    </g>

    <!-- ======================================================== -->
    <!-- THE REAL TOPCLOCK FLOATING ON TOP: PURE DIGITS + OUTLINE -->
    <!-- ZERO CONTAINER, ZERO CARD, 100% TRANSPARENT BACKGROUND   -->
    <!-- ======================================================== -->
    <g transform="translate(230, 30)" filter="url(#clockShadow)">
      
      <!-- Ghost Click Passthrough Visual Cue Indicator -->
      <g transform="translate(4, -8)">
        <rect x="0" y="0" width="220" height="22" rx="4" fill="#0c0c10" fill-opacity="0.8" stroke="#32323e" stroke-width="1" />
        <circle cx="12" cy="11" r="3" fill="#faff69" />
        <text x="22" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#faff69" letter-spacing="0.5">TRANSPARENT ALWAYS-ON-TOP</text>
      </g>

      <!-- The Real Clock Numbers (white fill, thick black stroke outline) -->
      <!-- Exactly matching the user's uploaded screenshot of the live clock -->
      <text x="114" y="100" text-anchor="middle"
            font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" 
            font-size="96" 
            font-weight="900"
            fill="#ffffff" 
            stroke="#000000" 
            stroke-width="7" 
            stroke-linejoin="round"
            paint-order="stroke fill"
            letter-spacing="-2">3:43</text>
    </g>

    <!-- Sub-badge at the bottom of the window preview explaining the behavior -->
    <g transform="translate(18, 290)">
      <rect x="0" y="0" width="474" height="32" rx="6" fill="#101015" stroke="#252532" stroke-width="1" />
      <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="500" fill="#a4a4b8">
        <tspan fill="#faff69" font-weight="700">Zero Interruption:</tspan> Click code or buttons underneath directly. Hold <tspan fill="#faff69" font-weight="700">[Ctrl]</tspan> to drag clock.
      </text>
    </g>

  </g>
</svg>