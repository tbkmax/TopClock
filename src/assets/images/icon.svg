<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="canvasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181c" />
      <stop offset="50%" stop-color="#101014" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>

    <!-- Floating HUD Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f1f26" />
      <stop offset="100%" stop-color="#111115" />
    </linearGradient>

    <!-- Dial Ring Gradient -->
    <linearGradient id="dialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a34" />
      <stop offset="100%" stop-color="#14141a" />
    </linearGradient>

    <!-- Electric Yellow Glow Filter -->
    <filter id="yellowGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Deep Elevation Shadow for "On Top" feel -->
    <filter id="cardShadow" x="-25%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Base Icon Squircle Canvas -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#canvasGrad)" stroke="#26262e" stroke-width="5" />

  <!-- Underlay Layer / Desk Surface (demonstrates the clock is layered "On Top") -->
  <rect x="100" y="116" width="312" height="312" rx="44" fill="#0d0d10" stroke="#25252e" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.6" />

  <!-- Floating "On Top" Elevation Card -->
  <g filter="url(#cardShadow)">
    <rect x="74" y="66" width="364" height="364" rx="58" fill="url(#cardGrad)" stroke="#32323e" stroke-width="3.5" />
    
    <!-- Clock Outer Dial Ring -->
    <circle cx="256" cy="244" r="132" fill="#0c0c10" stroke="url(#dialGrad)" stroke-width="6" />
    
    <!-- Subtle Inner Track -->
    <circle cx="256" cy="244" r="114" fill="none" stroke="#1d1d25" stroke-width="2" stroke-dasharray="3 7" />

    <!-- Top Apex "On Top" Chevron Mark -->
    <path d="M 240 144 L 256 128 L 272 144" fill="none" stroke="#faff69" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#yellowGlow)" />
    
    <!-- 12 o'clock Apex Marker -->
    <line x1="256" y1="138" x2="256" y2="158" stroke="#faff69" stroke-width="5" stroke-linecap="round" filter="url(#yellowGlow)" />
    
    <!-- Cardinal Markers: 3, 6, 9 -->
    <line x1="372" y1="244" x2="352" y2="244" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.9" />
    <line x1="256" y1="360" x2="256" y2="340" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.9" />
    <line x1="140" y1="244" x2="160" y2="244" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.9" />

    <!-- Intermediate Hour Dots -->
    <circle cx="316" cy="180" r="3.5" fill="#6f6f82" />
    <circle cx="350" cy="214" r="3.5" fill="#6f6f82" />
    <circle cx="350" cy="274" r="3.5" fill="#6f6f82" />
    <circle cx="316" cy="308" r="3.5" fill="#6f6f82" />
    <circle cx="196" cy="308" r="3.5" fill="#6f6f82" />
    <circle cx="162" cy="274" r="3.5" fill="#6f6f82" />
    <circle cx="162" cy="214" r="3.5" fill="#6f6f82" />
    <circle cx="196" cy="180" r="3.5" fill="#6f6f82" />

    <!-- Clock Hands (10:10 layout) -->
    <!-- Hour Hand pointing to ~10 -->
    <line x1="256" y1="244" x2="194" y2="182" stroke="#ffffff" stroke-width="11" stroke-linecap="round" />
    <!-- Minute Hand pointing to ~2 in electric yellow -->
    <line x1="256" y1="244" x2="336" y2="164" stroke="#faff69" stroke-width="8" stroke-linecap="round" filter="url(#yellowGlow)" />

    <!-- Center Pivot Hub -->
    <circle cx="256" cy="244" r="11" fill="#faff69" filter="url(#yellowGlow)" />
    <circle cx="256" cy="244" r="4.5" fill="#0c0c10" />
  </g>

  <!-- Wordmark in micro-typography -->
  <text x="256" y="408" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="16" font-weight="800" fill="#faff69" letter-spacing="4" opacity="0.95">TOPCLOCK</text>
</svg>