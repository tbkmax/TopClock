<div class="addon-instance-controls" x-show="addon.kind === 'timer'">
    <label><span x-text="t('addons.timerMode')"></span>
        <select class="select-control" :value="addon.options.mode"
            @change="timerChange('mode', $event.target.value); $event.target.value = addon.options.mode"
            :aria-label="t('addons.timerMode')">
            <option value="countdown" x-text="t('addons.countdown')"></option>
            <option value="stopwatch" x-text="t('addons.stopwatch')"></option>
        </select>
    </label>
    <label x-show="addon.options.mode === 'countdown'">
        <span x-text="t('addons.minutes')"></span>
        <input class="addon-number" type="number" min="1" max="5999"
            :value="Math.round(addon.options.duration_seconds / 60)"
            @change="timerChange('duration_seconds', Math.max(60, Math.min(359940, Math.round(Number($event.target.value) || 1) * 60))); $event.target.value = Math.round(addon.options.duration_seconds / 60)"
            :disabled="addon.enabled && timerSession?.running" :aria-label="t('addons.countdownMinutes')">
    </label>
    <button type="button" class="action-button progress-preset-entry" x-show="addon.options.mode === 'countdown'" @click="openAddonDetails(addon.kind)" x-text="t('addons.details')"></button>
    <small x-show="addon.enabled && timerSession?.running && addon.options.mode === 'countdown'" x-text="t('addons.pauseBeforeDurationChange')"></small>
</div>
