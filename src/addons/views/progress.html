                            <template x-if="addon.kind === 'progress'"><div class="progress-settings">
                                <div class="addon-instance-controls"><label><span x-text="t('addons.progressMode')"></span><select class="select-control" :value="addon.options.mode" @change="setProgressMode(addon.id, $event.target.value)" :aria-label="t('addons.progressMode')"><option value="date" x-text="t('addons.dateProgress')"></option><option value="time" x-text="t('addons.timeProgress')"></option><option value="countdown" x-text="t('addons.countdown')"></option></select></label></div>
                                <div class="addon-instance-controls progress-appearance"><label><span x-text="`${t('addons.barLength')} · ${addon.options.bar_length_percent ?? 85}%`"></span><input class="size-range" type="range" min="50" max="150" step="5" :value="addon.options.bar_length_percent ?? 85" :style="rangeStyle(addon.options.bar_length_percent ?? 85, 50, 150)" @input="updateProgressAppearance(addon.id, 'bar_length_percent', Number($event.target.value))" :aria-label="t('addons.barLength')"></label><label><span x-text="`${t('addons.barThickness')} · ${addon.options.bar_thickness_percent ?? 100}%`"></span><input class="size-range" type="range" min="50" max="200" step="10" :value="addon.options.bar_thickness_percent ?? 100" :style="rangeStyle(addon.options.bar_thickness_percent ?? 100, 50, 200)" @input="updateProgressAppearance(addon.id, 'bar_thickness_percent', Number($event.target.value))" :aria-label="t('addons.barThickness')"></label><label class="addon-option-switch"><span x-text="t('addons.showPercentage')"></span><button type="button" class="switch" role="switch" :aria-checked="addon.options.show_percentage === true" :class="{ on: addon.options.show_percentage === true }" :aria-label="t('addons.showPercentage')" @click="updateProgressAppearance(addon.id, 'show_percentage', addon.options.show_percentage !== true)"><span></span></button></label></div>
                                <template x-if="addon.options.mode === 'date'"><div class="addon-instance-controls"><label><span x-text="t('addons.startDate')"></span><input class="addon-date" type="date" :value="addon.options.start_date" @change="updateProgressDate(addon.id, 'start_date', $event.target.value); $event.target.value = addon.options.start_date" :aria-label="t('addons.startDate')"></label><label><span x-text="t('addons.endDate')"></span><input class="addon-date" type="date" :min="addon.options.start_date" :value="addon.options.end_date" @change="updateProgressDate(addon.id, 'end_date', $event.target.value); $event.target.value = addon.options.end_date" :aria-label="t('addons.endDate')"></label></div></template>
                                <template x-if="addon.options.mode === 'time'">
                                    <div x-data="{ selectedRange: null, draftStart: '', draftEnd: '' }">
                                        <div class="progress-range-heading" x-text="t('addons.dailyRanges')"></div>
                                        <div class="progress-week-grid-scroll">
                                            <table class="progress-week-grid">
                                                <caption class="visually-hidden" x-text="t('addons.weekGridCaption')"></caption>
                                                <colgroup><col class="progress-week-time-column"><col span="7"></colgroup>
                                                <thead><tr><th scope="col" x-text="t('addons.time')"></th><template x-for="day in progressWeekdays()" :key="day"><th scope="col" x-text="progressWeekdayLabel(day)"></th></template></tr></thead>
                                                <tbody><template x-for="(range, index) in addon.options.ranges" :key="index"><tr>
                                                    <th scope="row"><button type="button" class="progress-week-time" :class="{ 'is-selected': selectedRange === index }" :aria-expanded="selectedRange === index" :aria-controls="'progress-time-editor-' + addon.id" :aria-label="t('addons.editRange', { count: index + 1, time: range.start + '–' + range.end })" @click="selectedRange = selectedRange === index ? null : index; draftStart = range.start; draftEnd = range.end"><span x-text="range.start + '–' + range.end"></span><span aria-hidden="true">⌄</span></button></th>
                                                    <template x-for="day in progressWeekdays()" :key="day"><td><button type="button" class="progress-week-cell" :class="{ 'is-selected': progressWeekdaySelected(range, day) }" :aria-pressed="progressWeekdaySelected(range, day)" :aria-label="range.start + '–' + range.end + ', ' + progressWeekdayLabel(day)" @click="setProgressWeekday(addon.id, index, day)"><span aria-hidden="true">✓</span></button></td></template>
                                                </tr></template></tbody>
                                            </table>
                                        </div>
                                        <p class="progress-hint" x-text="t('addons.weekGridHint')"></p>
                                        <div class="progress-time-editor" :id="'progress-time-editor-' + addon.id" x-show="selectedRange !== null" x-cloak>
                                            <div class="progress-time-editor-heading"><strong x-text="t('addons.editTime')"></strong><button type="button" class="action-button" :disabled="!addon.options.ranges[selectedRange]?.days?.length" @click="setProgressWeekday(addon.id, selectedRange, null)" x-text="t('addons.everyDay')"></button></div>
                                            <div class="progress-range"><label><span x-text="t('addons.startTime')"></span><input class="addon-time-input" type="time" x-model="draftStart" :aria-label="t('addons.startTime')"></label><label><span x-text="t('addons.endTime')"></span><input class="addon-time-input" type="time" x-model="draftEnd" :aria-label="t('addons.endTime')"></label></div>
                                            <div class="progress-time-editor-actions"><button type="button" class="action-button primary-action" @click="selectedRange = updateProgressRangeTimes(addon.id, selectedRange, draftStart, draftEnd) === null ? selectedRange : null" x-text="t('addons.savePeriod')"></button><button type="button" class="action-button" @click="selectedRange = null" x-text="t('addons.cancelPeriod')"></button><button type="button" class="action-button" :disabled="addon.options.ranges.length === 1" @click="removeProgressRange(addon.id, selectedRange); selectedRange = null" x-text="t('addons.removeRange')"></button></div>
                                        </div>
                                        <button type="button" class="action-button progress-add-range" :disabled="!canAddProgressRange(addon)" @click="selectedRange = addProgressRange(addon.id); draftStart = addon.options.ranges[selectedRange].start; draftEnd = addon.options.ranges[selectedRange].end" x-text="t('addons.addRange')"></button>
                                         <label class="progress-hide-option"><span x-text="t('addons.autoHide')"></span><button type="button" class="switch" role="switch" :aria-checked="addon.options.auto_hide" :class="{ on: addon.options.auto_hide }" :aria-label="t('addons.autoHide')" @click="editAddonOption(addon, 'auto_hide', !addon.options.auto_hide)"><span></span></button></label>
                                        <p class="progress-hint" x-text="t('addons.autoHideHint')"></p>
                                    </div>
                                </template>
                                <template x-if="addon.options.mode === 'countdown'"><div class="addon-instance-controls"><label><span x-text="t('addons.countdownMinutes')"></span><input class="addon-number" type="number" min="1" max="5999" step="1" :value="Math.round((addon.options.countdown_seconds ?? 300) / 60)" :disabled="progressCountdownDurationLocked(addon.id)" @input="updateProgressCountdownDuration(addon.id, Number($event.target.value))" @blur="$event.target.value = Math.round((addon.options.countdown_seconds ?? 300) / 60)" :aria-label="t('addons.countdownMinutes')"></label><small x-show="progressCountdownDurationLocked(addon.id)" x-text="t('addons.progressMinutesLocked')"></small></div></template>
                            </div></template>
