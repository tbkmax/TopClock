[package]
name = "top_clock"
version = "0.0.0"
description = "Transparent always-on-top desktop clock"
authors = ["maxtc"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Devices_Display", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Storage_Packaging_Appx", "Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows = { version = "0.62", features = ["ApplicationModel", "Services_Store", "Win32_System_WinRT", "Win32_UI_Shell"] }
webview2-com-sys = "0.39"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
