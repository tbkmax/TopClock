[package]
name = "top_clock"
version = "0.0.0"
description = "Transparent always-on-top desktop clock"
authors = ["maxtc"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Devices_Display", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
