<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TopClock Settings</title>
</head>
<body>
    <div id="settings-app" x-data="settingsApp" x-cloak>
        <header class="titlebar" @mousedown="startDrag($event)">
            <div class="brand-mark" aria-hidden="true">:</div>
            <div class="titlebar-name">TOPCLOCK <span> / SETTINGS</span></div>
            <div class="window-actions">
                <button class="window-action" type="button" title="Minimize" aria-label="Minimize" @mousedown.stop @click="minimize()">
                    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12"/></svg>
                </button>
                <button class="window-action close-action" type="button" title="Close settings" aria-label="Close settings" @mousedown.stop @click="close()">
                    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg>
                </button>
            </div>
        </header>

        <div class="settings-layout">
            <aside class="sidebar" aria-label="Settings sections">
                <div class="sidebar-kicker">WORKSPACE</div>
                <nav class="tab-list" aria-label="Settings tabs">
                    <button type="button" class="tab-button" :class="{ active: tab === 'clock' }" :aria-selected="tab === 'clock'" @click="stopRecording(); tab = 'clock'">
                        <span class="tab-glyph">◷</span> Clock <span class="tab-arrow">›</span>
                    </button>
                    <button type="button" class="tab-button" :class="{ active: tab === 'addons' }" :aria-selected="tab === 'addons'" @click="stopRecording(); tab = 'addons'">
                        <span class="tab-glyph">＋</span> Add-ons <span class="tab-arrow">›</span>
                    </button>
                    <button type="button" class="tab-button" :class="{ active: tab === 'shortcuts' }" :aria-selected="tab === 'shortcuts'" @click="stopRecording(); tab = 'shortcuts'">
                        <span class="tab-glyph">⌨</span> Shortcuts <span class="tab-arrow">›</span>
                    </button>
                    <button type="button" class="tab-button" :class="{ active: tab === 'general' }" :aria-selected="tab === 'general'" @click="stopRecording(); tab = 'general'">
                        <span class="tab-glyph">⚙</span> General <span class="tab-arrow">›</span>
                    </button>
                </nav>
                <div class="sidebar-bottom"><span class="status-dot"></span> CLOCK RUNNING <span class="version" x-text="`v${appVersion}`">v0.0.0</span></div>
            </aside>

            <main class="settings-content">
                <template x-if="tab === 'clock'">
                <section class="tab-panel">
                    <div class="section-kicker">DISPLAY / 01</div>
                    <h1>Make time yours<span class="yellow-period">.</span></h1>
                    <p class="section-description">Changes appear on your desktop clock as you make them.</p>

                    <div class="preview-card">
                        <div class="preview-heading"><span>LIVE PREVIEW</span><span class="preview-live"><i></i> LIVE</span></div>
                        <div class="preview-time" :class="[`colon-${settings.colon_animation}`, `number-${settings.number_animation}`]" :style="previewStyle()">
                            <template x-for="(part, index) in previewParts" :key="index">
                                <span :class="{ 'preview-colon': part.kind === 'separator', 'preview-number': ['h', 'm', 's'].includes(part.kind), 'preview-ampm': part.kind === 'ampm', 'number-changing': part.changing }" x-text="part.text"></span>
                            </template>
                        </div>
                        <div class="preview-caption" x-text="settings.font_size > 64 ? 'Large sizes are scaled down in this preview' : 'Your desktop clock updates instantly'"></div>
                    </div>

                    <div class="control-grid">
                        <label class="control-card color-card">
                            <span class="control-title">Font color</span>
                            <span class="control-description">The face of your clock</span>
                            <span class="color-control"><input type="color" :value="settings.font_color" @input="settings.font_color = $event.target.value; save()" aria-label="Font color"><span x-text="settings.font_color.toUpperCase()"></span></span>
                        </label>
                        <label class="control-card color-card">
                            <span class="control-title">Outline color</span>
                            <span class="control-description">Contrast against your desktop</span>
                            <span class="color-control"><input type="color" :value="settings.outline_color" @input="settings.outline_color = $event.target.value; save()" aria-label="Outline color"><span x-text="settings.outline_color.toUpperCase()"></span></span>
                        </label>
                    </div>

                    <div class="setting-row size-row">
                        <div><div class="control-title">Clock size</div><div class="control-description">Set the type size from 24 to 200 pixels</div></div>
                        <div class="slider-area"><input class="size-range" type="range" min="24" max="200" :value="settings.font_size" :style="rangeStyle(settings.font_size, 24, 200)" @input="settings.font_size = Number($event.target.value); save()" aria-label="Clock size"><span class="size-value" x-text="`${settings.font_size} px`"></span></div>
                    </div>
                    <div class="setting-row">
                        <div><div class="control-title">Outline thickness</div><div class="control-description">From no outline to a bold 4 pixel edge</div></div>
                        <div class="slider-area"><input class="size-range" type="range" min="0" max="4" step="0.5" :value="settings.outline_width" :style="rangeStyle(settings.outline_width, 0, 4)" @input="settings.outline_width = Number($event.target.value); save()" aria-label="Outline thickness"><span class="size-value" x-text="`${settings.outline_width} px`"></span></div>
                    </div>
                    <div class="setting-row">
                        <div><div class="control-title">Font family</div><div class="control-description" x-text="fontListError ? 'Windows font list is unavailable' : fontsLoading ? 'Loading installed fonts…' : `${fontFamilies.length} installed fonts`"></div></div>
                        <select class="select-control font-select" x-model="settings.font_family" @change="save()" :disabled="fontsLoading || fontListError" :title="settings.font_family" aria-label="Font family">
                            <template x-for="family in fontFamilies" :key="family"><option :value="family" x-text="family"></option></template>
                        </select>
                    </div>
                    <div class="setting-row">
                        <div><div class="control-title">Time layout</div><div class="control-description">Choose which parts appear</div></div>
                        <select class="select-control" x-model="settings.time_layout" @change="save()" aria-label="Time layout"><template x-for="layout in layouts" :key="layout.value"><option :value="layout.value" x-text="layout.label"></option></template></select>
                    </div>
                    <div class="setting-row">
                        <div><div class="control-title">24-hour time</div><div class="control-description">Use 18 instead of 06 in the evening</div></div>
                        <button type="button" class="switch" role="switch" :aria-checked="settings.twenty_four_hour" :class="{ on: settings.twenty_four_hour }" aria-label="24-hour time" @click="settings.twenty_four_hour = !settings.twenty_four_hour; save()"><span></span></button>
                    </div>
                    <div class="setting-row" x-show="!settings.twenty_four_hour && settings.time_layout.includes('h')">
                        <div><div class="control-title">Show AM / PM</div><div class="control-description">Label morning and evening in 12-hour time</div></div>
                        <button type="button" class="switch" role="switch" :aria-checked="settings.show_ampm" :class="{ on: settings.show_ampm }" aria-label="Show AM or PM" @click="settings.show_ampm = !settings.show_ampm; save()"><span></span></button>
                    </div>
                    <div class="setting-row">
                        <div><div class="control-title">Colon animation</div><div class="control-description">Motion for the separators</div></div>
                        <select class="select-control" x-model="settings.colon_animation" @change="save()" aria-label="Colon animation"><template x-for="animation in colonAnimations" :key="animation.value"><option :value="animation.value" x-text="animation.label"></option></template></select>
                    </div>
                    <div class="setting-row">
                        <div><div class="control-title">Number change animation</div><div class="control-description">Motion when a displayed number changes</div></div>
                        <select class="select-control" x-model="settings.number_animation" @change="save()" aria-label="Number change animation"><template x-for="animation in numberAnimations" :key="animation.value"><option :value="animation.value" x-text="animation.label"></option></template></select>
                    </div>
                </section>
                </template>

                <template x-if="tab === 'addons'">
                <section class="tab-panel">
                    <div class="section-kicker">EXTENSIONS / 02</div>
                    <h1>More than time<span class="yellow-period">.</span></h1>
                    <p class="section-description">Extra displays and widgets to enhance your desktop clock.</p>
                    <div class="addon-card">
                        <div class="addon-icon">⏱</div>
                        <div style="flex: 1;">
                            <div class="addon-title">Timer</div>
                            <p>Keep a countdown below your clock.</p>
                        </div>
                        <button type="button" class="switch" role="switch" :aria-checked="settings.timer_addon_enabled" :class="{ on: settings.timer_addon_enabled }" aria-label="Toggle Timer Add-on" @click="settings.timer_addon_enabled = !settings.timer_addon_enabled; save()"><span></span></button>
                    </div>
                    <div class="addon-card"><div class="addon-icon">◎</div><div><div class="addon-title">World clocks</div><p>Follow the time in another region.</p></div><span class="coming-soon">COMING SOON</span></div>
                </section>
                </template>

                <template x-if="tab === 'shortcuts'">
                <section class="tab-panel">
                    <div class="section-kicker">SHORTCUTS / 03</div>
                    <h1>Control at your fingertips<span class="yellow-period">.</span></h1>
                    <p class="section-description">Customize key combinations. Internal conflicts between actions are highlighted automatically.</p>

                    <!-- Conflict alert banner -->
                    <template x-if="hasAnyConflict">
                        <div class="conflict-alert" role="alert">
                            <span class="conflict-icon">⚠️</span>
                            <div>
                                <div class="conflict-title">Shortcut conflict detected</div>
                                <div class="conflict-text">Multiple actions share the same key combination. Conflicting shortcuts are highlighted below.</div>
                            </div>
                        </div>
                    </template>

                    <!-- Box 1: Default Shortcuts -->
                    <div class="shortcut-box">
                        <div class="shortcut-box-header">
                            <div class="shortcut-box-title">TOPCLOCK DEFAULT SHORTCUTS</div>
                            <div class="shortcut-box-desc">Core interactions for operating the desktop clock</div>
                        </div>

                        <!-- Interaction Modifier Row -->
                        <div class="shortcut-row">
                            <div class="shortcut-info">
                                <div class="shortcut-name">Interaction Modifier</div>
                                <div class="shortcut-desc">Hold this modifier to move or right-click the transparent clock</div>
                            </div>
                            <div class="shortcut-action">
                                <select class="select-control modifier-select" x-model="settings.shortcuts.interaction_modifier" @change="save()" aria-label="Interaction Modifier">
                                    <option value="Ctrl">Ctrl</option>
                                    <option value="Alt">Alt</option>
                                    <option value="Shift">Shift</option>
                                </select>
                            </div>
                        </div>

                        <!-- Open Settings Row -->
                        <div class="shortcut-row" :class="{ 'has-conflict': getConflict('open_settings') }">
                            <div class="shortcut-info">
                                <div class="shortcut-name">Open Settings</div>
                                <div class="shortcut-desc">Show settings window while clock is active</div>
                                <template x-if="getConflict('open_settings')">
                                    <div class="conflict-badge" x-text="`⚠️ Conflict: Also assigned to ${getConflict('open_settings')}`"></div>
                                </template>
                            </div>
                            <div class="shortcut-action">
                                <div class="keys-container" :class="{ 'recording': recordingAction === 'open_settings' }">
                                    <template x-if="recordingAction === 'open_settings'">
                                        <span class="recording-badge">Press keys (Esc to cancel)...</span>
                                    </template>
                                    <template x-if="recordingAction !== 'open_settings'">
                                        <div class="keys-list">
                                            <template x-for="(k, i) in formatShortcutKeys(settings.shortcuts?.open_settings)" :key="i">
                                                <span class="key-pill" :class="{ 'none-pill': k === 'None' }" x-text="k"></span>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                                <div class="shortcut-buttons">
                                    <button type="button" class="action-button record-btn" :class="{ active: recordingAction === 'open_settings' }" @click="recordingAction === 'open_settings' ? stopRecording() : startRecording('open_settings')">
                                        <span x-text="recordingAction === 'open_settings' ? 'Cancel' : 'Change'"></span>
                                    </button>
                                    <button type="button" class="action-button clear-btn" title="Set to None (no shortcut)" :disabled="!settings.shortcuts?.open_settings" @click="clearShortcut('open_settings')">
                                        Clear
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Quit TopClock Row -->
                        <div class="shortcut-row" :class="{ 'has-conflict': getConflict('quit') }">
                            <div class="shortcut-info">
                                <div class="shortcut-name">Quit TopClock</div>
                                <div class="shortcut-desc">Exit application completely</div>
                                <template x-if="getConflict('quit')">
                                    <div class="conflict-badge" x-text="`⚠️ Conflict: Also assigned to ${getConflict('quit')}`"></div>
                                </template>
                            </div>
                            <div class="shortcut-action">
                                <div class="keys-container" :class="{ 'recording': recordingAction === 'quit' }">
                                    <template x-if="recordingAction === 'quit'">
                                        <span class="recording-badge">Press keys (Esc to cancel)...</span>
                                    </template>
                                    <template x-if="recordingAction !== 'quit'">
                                        <div class="keys-list">
                                            <template x-for="(k, i) in formatShortcutKeys(settings.shortcuts?.quit)" :key="i">
                                                <span class="key-pill" :class="{ 'none-pill': k === 'None' }" x-text="k"></span>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                                <div class="shortcut-buttons">
                                    <button type="button" class="action-button record-btn" :class="{ active: recordingAction === 'quit' }" @click="recordingAction === 'quit' ? stopRecording() : startRecording('quit')">
                                        <span x-text="recordingAction === 'quit' ? 'Cancel' : 'Change'"></span>
                                    </button>
                                    <button type="button" class="action-button clear-btn" title="Set to None (no shortcut)" :disabled="!settings.shortcuts?.quit" @click="clearShortcut('quit')">
                                        Clear
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Box 2: Add-on Shortcuts -->
                    <div class="shortcut-box">
                        <div class="shortcut-box-header">
                            <div class="shortcut-box-header-row">
                                <div class="shortcut-box-title">ADD-ON SHORTCUTS</div>
                                <span class="addon-status-pill" :class="settings.timer_addon_enabled ? 'status-enabled' : 'status-disabled'" x-text="settings.timer_addon_enabled ? 'TIMER: ENABLED' : 'TIMER: DISABLED'"></span>
                            </div>
                            <div class="shortcut-box-desc">Dedicated shortcuts for add-ons. Only changeable when the respective add-on is enabled.</div>
                        </div>

                        <!-- Timer Start / Stop -->
                        <div class="shortcut-row" :class="{ 'disabled-row': !settings.timer_addon_enabled, 'has-conflict': getConflict('timer_toggle') }">
                            <div class="shortcut-info">
                                <div class="shortcut-name">Timer Start / Stop</div>
                                <div class="shortcut-desc" x-text="settings.timer_addon_enabled ? 'Start or pause the timer' : 'Enable the Timer add-on in the Add-ons tab to configure this shortcut'"></div>
                                <template x-if="getConflict('timer_toggle')">
                                    <div class="conflict-badge" x-text="`⚠️ Conflict: Also assigned to ${getConflict('timer_toggle')}`"></div>
                                </template>
                            </div>
                            <div class="shortcut-action">
                                <div class="keys-container" :class="{ 'recording': recordingAction === 'timer_toggle', 'disabled': !settings.timer_addon_enabled }">
                                    <template x-if="recordingAction === 'timer_toggle'">
                                        <span class="recording-badge">Press keys (Esc to cancel)...</span>
                                    </template>
                                    <template x-if="recordingAction !== 'timer_toggle'">
                                        <div class="keys-list">
                                            <template x-for="(k, i) in formatShortcutKeys(settings.shortcuts?.timer_toggle)" :key="i">
                                                <span class="key-pill" :class="{ 'none-pill': k === 'None' }" x-text="k"></span>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                                <div class="shortcut-buttons">
                                    <button type="button" class="action-button record-btn" :class="{ active: recordingAction === 'timer_toggle' }" :disabled="!settings.timer_addon_enabled" @click="recordingAction === 'timer_toggle' ? stopRecording() : startRecording('timer_toggle')">
                                        <span x-text="recordingAction === 'timer_toggle' ? 'Cancel' : 'Change'"></span>
                                    </button>
                                    <button type="button" class="action-button clear-btn" title="Set to None (no shortcut)" :disabled="!settings.timer_addon_enabled || !settings.shortcuts?.timer_toggle" @click="clearShortcut('timer_toggle')">
                                        Clear
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Timer Reset -->
                        <div class="shortcut-row" :class="{ 'disabled-row': !settings.timer_addon_enabled, 'has-conflict': getConflict('timer_reset') }">
                            <div class="shortcut-info">
                                <div class="shortcut-name">Timer Reset</div>
                                <div class="shortcut-desc" x-text="settings.timer_addon_enabled ? 'Reset the timer back to zero' : 'Enable the Timer add-on in the Add-ons tab to configure this shortcut'"></div>
                                <template x-if="getConflict('timer_reset')">
                                    <div class="conflict-badge" x-text="`⚠️ Conflict: Also assigned to ${getConflict('timer_reset')}`"></div>
                                </template>
                            </div>
                            <div class="shortcut-action">
                                <div class="keys-container" :class="{ 'recording': recordingAction === 'timer_reset', 'disabled': !settings.timer_addon_enabled }">
                                    <template x-if="recordingAction === 'timer_reset'">
                                        <span class="recording-badge">Press keys (Esc to cancel)...</span>
                                    </template>
                                    <template x-if="recordingAction !== 'timer_reset'">
                                        <div class="keys-list">
                                            <template x-for="(k, i) in formatShortcutKeys(settings.shortcuts?.timer_reset)" :key="i">
                                                <span class="key-pill" :class="{ 'none-pill': k === 'None' }" x-text="k"></span>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                                <div class="shortcut-buttons">
                                    <button type="button" class="action-button record-btn" :class="{ active: recordingAction === 'timer_reset' }" :disabled="!settings.timer_addon_enabled" @click="recordingAction === 'timer_reset' ? stopRecording() : startRecording('timer_reset')">
                                        <span x-text="recordingAction === 'timer_reset' ? 'Cancel' : 'Change'"></span>
                                    </button>
                                    <button type="button" class="action-button clear-btn" title="Set to None (no shortcut)" :disabled="!settings.timer_addon_enabled || !settings.shortcuts?.timer_reset" @click="clearShortcut('timer_reset')">
                                        Clear
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Reset all shortcuts footer -->
                    <div class="shortcut-footer">
                        <button type="button" class="action-button reset-shortcuts-btn" @click="resetAllShortcuts()">
                            <span>Reset All Shortcuts to Default</span>
                        </button>
                    </div>
                </section>
                </template>

                <template x-if="tab === 'general'">
                <section class="tab-panel">
                    <div class="section-kicker">PREFERENCES / 04</div>
                    <h1>Your clock, your way<span class="yellow-period">.</span></h1>
                    <p class="section-description">Choose how TopClock behaves on your PC.</p>
                    <div class="general-panel">
                        <div class="setting-row">
                            <div><div class="control-title">Launch when I sign in</div><div class="control-description">Start the clock with Windows</div></div>
                            <button type="button" class="switch" role="switch" :aria-checked="startupEnabled" :class="{ on: startupEnabled }" aria-label="Launch when I sign in" @click="toggleStartup()"><span></span></button>
                        </div>
                        <div class="setting-row">
                            <div><div class="control-title">Automatically check for updates</div><div class="control-description">Check GitHub Releases when TopClock starts</div></div>
                            <button type="button" class="switch" role="switch" :aria-checked="settings.auto_check_updates" :class="{ on: settings.auto_check_updates }" aria-label="Automatically check for updates" @click="settings.auto_check_updates = !settings.auto_check_updates; save()"><span></span></button>
                        </div>
                        <div class="setting-row update-row">
                            <div>
                                <div class="control-title">Software Updates</div>
                                <div class="control-description" x-text="updateStatusText"></div>
                            </div>
                            <div class="update-actions">
                                <template x-if="updateAvailable">
                                    <button type="button" class="action-button primary-action" @click="openRelease()">
                                        <span>Download Update ↗</span>
                                    </button>
                                </template>
                                <template x-if="!updateAvailable">
                                    <button type="button" class="action-button" :disabled="isCheckingUpdate" @click="checkForUpdates(true)">
                                        <span x-text="isCheckingUpdate ? 'Checking…' : 'Check for updates'"></span>
                                    </button>
                                </template>
                            </div>
                        </div>
                    </div>
                    <div class="tip-card"><span>TIP</span> Hold Ctrl and drag the desktop clock to move it. Ctrl + click switches time format.</div>
                </section>
                </template>
                <div class="error-toast" x-show="error" x-transition.opacity x-text="error" x-cloak role="alert"></div>
            </main>
        </div>
    </div>
    <script type="module" src="/src/settings.js"></script>
</body>
</html>
